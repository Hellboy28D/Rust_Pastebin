<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rustacious</title>

    <!-- Tailwind CSS -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.15/dist/tailwind.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Roboto', sans-serif;
        }

        .logo {
            width: 16rem;
            height: 9rem;
        }
    </style>
</head>

<body class="bg-gray-800 text-white min-h-screen flex flex-col justify-center items-center">

    <img
        src="https://rustacean.net/more-crabby-things/dancing-ferris.gif"
        alt="Rust mascot"
        class="logo mb-4">

    <h1 class="text-3xl font-bold mb-4">Rust PasteBin</h1>

    <h5 class="text-lg mb-10 text-gray-300 text-center">
        A Minimal Pastebin application built with Rust!
    </h5>

    <form
        class="w-full max-w-md bg-gray-700 rounded-lg p-6 shadow-md"
        action="/submit"
        method="post">

        <label
            for="content"
            class="block mb-2 text-sm font-medium">
            Paste your text
        </label>

        <textarea
            id="content"
            name="content"
            rows="10"
            placeholder="Paste your code or text here..."
            class="w-full p-3 border border-gray-600 rounded-md mb-4 bg-black text-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
            required></textarea>

        <button
            type="submit"
            class="w-full bg-indigo-600 text-white py-2 px-4 rounded-md hover:bg-indigo-700 transition">
            Submit
        </button>

    </form>

</body>
</html>
